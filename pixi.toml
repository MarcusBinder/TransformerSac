# Small pixi env to run the derate-only power-tracking Transformer-SAC trainer
# (transformer_sac_windfarm_tracking.py) with the steady-state pywake backend.
#
# Layout notes:
#   - dynamiks + jDWM are the repo's local submodules, installed editable from
#     ../dynamiks and ../jdwm (WindGym imports dynamiks at module load, even for
#     the pywake backend).
#   - WindGym itself is NOT pip-installed: its metadata pins dynamiks==0.0.7,
#     which conflicts with the local editable dev dynamiks. Instead we put the
#     windgym submodule on PYTHONPATH (see [activation.env]) and provide its
#     runtime deps explicitly below.
#   - TransformerSac (this dir) is also on PYTHONPATH so `import config`,
#     `helpers`, `networks`, `replay_buffer` resolve from any cwd.
#   - CPU PyTorch: on a machine without CUDA, conda-forge resolves the CPU build.

[workspace]
name = "transformer-sac-tracking"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pytorch = ">=2.2"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib-base = "*"
h5py = "*"
netcdf4 = "*"
numba = "*"
tqdm = "*"
zarr = "*"
dask = "*"

[pypi-dependencies]
# WindGym pins xarray<2025; keep it here so the constraint is explicit.
xarray = ">=2022.0.0,<2025"
gymnasium = ">=1.0.0"
tyro = "*"
tensorboard = "*"
wandb = "*"
stable-baselines3 = "*"
pettingzoo = "*"
ipython = "*"
py-wake = "*"
hipersim = ">=0.1.7"
wetb = "*"
multiclass-interface = "*"
# Local editable submodules (pure-Python).
dynamiks = { path = "../dynamiks", editable = true }
jdwm = { path = "../jdwm", editable = true }

[activation.env]
# windgym submodule (tracking branch) + this trainer dir on the import path.
PYTHONPATH = "$PIXI_PROJECT_ROOT/../windgym:$PIXI_PROJECT_ROOT"

[tasks]
# Seconds-long env self-test (no training): builds the full stack, resets, and
# steps with random actions. Asserts obs (3,11), action (3,), tracking info.
smoke-env = "python smoke_tracking_env.py"

# First signs of life: derate-only farm-power tracking on the fixed track3 row.
train-smoke = """
python transformer_sac_windfarm_tracking.py \
  --exp-name track_smoke \
  --config power_tracking --backend pywake --action-type wind \
  --num-envs 1 --dt-sim 1 --dt-env 1 --max-episode-steps 400 --history-length 3 \
  --eval-interval 100000000 --no-track --total-timesteps 30000 --learning-starts 1000
"""
